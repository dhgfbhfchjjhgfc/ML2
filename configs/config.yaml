project:
  name: credit-card-fraud-v20
  variant: "V20"
  track: classic
  seed: 42

data:
  full_path: data/raw/creditcard.csv
  sample_path: data/sample.csv
  id_column: null
  target: Class
  time_column: null
  group_column: null
  drop_columns: []

task:
  type: binary
  positive_label: 1
  decision_threshold: 0.5

metric:
  primary: pr_auc
  secondary: [f1, recall, precision, brier]
  threshold: 0.80

split:
  strategy: stratified
  val_size: 0.15
  test_size: 0.15

features:
  numeric:
    - Amount
    - V1
    - V2
    - V3
    - V4
    - V5
    - V6
    - V7
    - V8
    - V9
    - V10
    - V11
    - V12
    - V13
    - V14
    - V15
    - V16
    - V17
    - V18
    - V19
    - V20
    - V21
    - V22
    - V23
    - V24
    - V25
    - V26
    - V27
    - V28
  categorical: []
  text: null

models:
  baseline:
    C: 1.0
    class_weight: balanced
  boosting:
    library: lightgbm
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    class_weight: balanced
  nn:
    framework: auto
    hidden: [128, 64]
    dropout: 0.2
    lr: 0.001
    weight_decay: 0.0001
    epochs: 20
    batch_size: 128
    patience: 6

optuna:
  n_trials: 15
  timeout_seconds: 600

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: credit-card-fraud-v20
  experiment_name: credit-card-fraud-v20
  log_model: true

evaluation:
  n_bootstrap: 1000
  ci_level: 0.95
  n_errors: 30
  slice_column: null

monitoring:
  reference: train
  shift:
    - {column: Amount, kind: scale, factor: 1.5}
    - {column: V1, kind: add, value: 1.2}
  alerts:
    drift_share: 0.25
    metric_drop: 0.05

smoke:
  rows: 1200
  n_trials: 3
  n_estimators: 30
  epochs: 5
  n_bootstrap: 100
  log_model: false
